<text x="690" y="101" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >STORY HOOK</text>
<text x="690" y="120" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Out-of-season cold and changing meltwater threaten winter stores</text>
<text x="690" y="137" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >and close the pass. The player secures a route and reaches the</text>
<text x="690" y="154" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >final Warden chapter at level 42.</text>
<text x="690" y="182" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >SETTLEMENTS</text>
<text x="690" y="201" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Pilgrim&#x27;s Rest is the main refuge around a hot spring; Rimewatch</text>
<text x="690" y="218" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >is the fortified pass outpost. Isolated shelters and miners&#x27;</text>
<text x="690" y="235" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >camps link them.</text>
<text x="690" y="263" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >BUILDING + SKILLS</text>
<text x="690" y="282" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Slate roofs, stone windbreaks, rope lifts, avalanche gates,</text>
<text x="690" y="299" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >hot-spring sheds, and insulated storehouses. Ore, mountain</text>
<text x="690" y="316" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >herbs, spring water, and monster parts feed high-tier smithing</text>
<text x="690" y="333" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >and potions.</text>
<text x="690" y="361" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >OPTIONAL CLUES</text>
<text x="690" y="380" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Snow and melt lines change across old boundary markers. The</text>
<text x="690" y="397" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Warden, human activity, and the failing Ember all remain</text>
<text x="690" y="414" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >plausible causes.</text>
