<rect x="666" y="74" width="510" height="500" rx="14" fill="#f7f2e4" stroke="#a29b84" stroke-width="2"/>
<text x="690" y="101" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >STORY HOOK</text>
<text x="690" y="120" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >A buried pass route and dangerous weather make shortcuts risky.</text>
<text x="690" y="137" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >A refuge needs supplies, and stones carry incompatible accounts</text>
<text x="690" y="154" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >of the Wardens without resolving them.</text>
<text x="690" y="182" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >SETTLEMENTS</text>
<text x="690" y="201" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Keep Greyfold as a narrower saddle after the magenta boundary is</text>
<text x="690" y="218" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >drawn. Greyfold Steading serves travelers; a roaming camp and</text>
<text x="690" y="235" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >small shelters support the pass, not another city.</text>
<text x="690" y="263" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >BUILDING + SKILLS</text>
<text x="690" y="282" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Turf-and-stone steading, wind screens, cairns, a watch keep,</text>
<text x="690" y="299" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >pack animal pens, and trail shelters. Ore, pale grasses, stone,</text>
<text x="690" y="316" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >and highland herbs support smithing and supplies.</text>
<text x="690" y="344" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700" fill="#526255" text-anchor="start" >OPTIONAL CLUES</text>
<text x="690" y="363" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >Standing stones present different accounts; compare them with</text>
<text x="690" y="380" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="400" fill="#303a34" text-anchor="start" >the heath&#x27;s water marks and the city&#x27;s records.</text>
