<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1210" viewBox="0 0 2040 1210">
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#eee3c5"/><stop offset="1" stop-color="#d6c69f"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101c1c" flood-opacity=".75"/></filter>
 <style>
  .title{font:bold 30px Georgia,serif;fill:#292d28;letter-spacing:2px}.sub{font:14px Georgia,serif;fill:#45544b;letter-spacing:1px}
  .region{font:bold 14px Georgia,serif;fill:#fff1c7;paint-order:stroke;stroke:#24312d;stroke-width:5px;stroke-linejoin:round;letter-spacing:.7px}
  .name{font:bold 14px Georgia,serif;fill:#fff5df;paint-order:stroke;stroke:#1e2928;stroke-width:4px;stroke-linejoin:round}
  .mini{font:bold 12px Georgia,serif;fill:#fff0d0;paint-order:stroke;stroke:#1e2928;stroke-width:4px;stroke-linejoin:round}
  .key{font:13px Georgia,serif;fill:#273632}.keyhead{font:bold 14px Georgia,serif;fill:#273632;letter-spacing:.8px}
 </style>
</defs>
<rect width="1640" height="1210" fill="url(#paper)"/>
<text x="35" y="42" class="title">THORNVALE · BIRD'S-EYE WORLD LAYOUT</text>
<text x="37" y="66" class="sub">STRAIGHT-DOWN MAP · TERRAIN-LED ZONES · LEVEL 1–45 · PLACEMENT CONCEPT</text>
