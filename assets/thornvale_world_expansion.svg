<!-- Side key keeps every label readable while pins remain anchored to visible landmarks. -->
<rect x="1610" y="85" width="390" height="1024" rx="8" fill="#efe4c8" stroke="#8b7e5e" stroke-width="2"/>
<text x="1635" y="125" class="keyhead">SETTLEMENTS &amp; CAMPS</text>
<g class="key"><text x="1635" y="160">1  Wanderer's Rest · starting camp</text><text x="1635" y="190">2  Tallowmere · farm hamlet</text><text x="1635" y="220">3  Hearthmoor · river city</text><text x="1635" y="250">4  Ashford · forest frontier</text><text x="1635" y="280">5  Sunkettle · stilt market</text><text x="1635" y="310">6  Blackbriar Lodge · hunter refuge</text><text x="1635" y="340">7  Pilgrim's Rest · hot spring refuge</text><text x="1635" y="370">8  Rimewatch · high pass fort</text><text x="1635" y="400">9  Quiet Cart · hidden merchant</text><text x="1635" y="430">10  Drowned Bell · chapel ruins</text><text x="1635" y="460">C  Roaming coast camp</text></g>
<text x="1635" y="515" class="keyhead">CAVES</text>
<g class="key"><text x="1635" y="548">A  Sea-cave · northwestern cliffs</text><text x="1635" y="578">B  Root cavern · Blackbriar ravine</text><text x="1635" y="608">C  Rimecrypt · mountain pass</text><text x="1635" y="638">D  Tidelock · southern sea cliffs</text><text x="1635" y="668">E  Weeping Grotto · waterfall gorge</text></g>
<text x="1635" y="723" class="keyhead">WARDEN CHAPTERS</text>
<g class="key"><text x="1635" y="756">I  Hornstag · level 12</text><text x="1635" y="786">II  Rootfather · level 22</text><text x="1635" y="816">III  Bogmaw · level 32</text><text x="1635" y="846">IV  Frost Wyrm · level 42</text></g>
<text x="1635" y="900" class="keyhead">MAP NOTES</text>
<g class="key"><text x="1635" y="933">Zone borders follow terrain and vegetation.</text><text x="1635" y="963">Roads and trails are painted into the</text><text x="1635" y="993">overhead rendering; numbered pins match</text><text x="1635" y="1023">the landmarks and proposed destinations.</text><text x="1635" y="1063">Concept layout; confirm distances in-game.</text></g>
</svg>
