<!-- The overhead terrain rendering already contains the winding road network; markers follow those routes. -->
<!-- district names placed on the actual terrain patterns in the shared rendering -->
<g transform="translate(52 85)" class="region" font-size="12">
 <text x="215" y="800">TALLOWFIELDS · 3–10</text>
 <text x="85" y="472">SALTFEN REACH · 19–28</text>
 <text x="530" y="613">HEARTHMOOR BASIN · 6–15</text>
 <text x="828" y="746">CAMPWATER VALE · 1–9</text>
 <text x="930" y="570">BRACKENWOOD FRINGE · 9–18</text>
 <text x="1070" y="330">BLACKBRIAR WILDS · 12–21</text>
 <text x="520" y="920">BELLWATER DELTA · 25–31</text>
 <text x="650" y="240">GREYFOLD DOWNS · 22–34</text>
 <text x="1190" y="230">FROSTSPINE CROWN · 29–38</text>
</g>
<!-- destination markers: town/camp labels and the cave/Warden key use coordinates in the same raster -->
<g transform="translate(52 85)" filter="url(#shadow)">
 <g fill="#e9bb61" stroke="#342e22" stroke-width="3" text-anchor="middle" class="mini">
